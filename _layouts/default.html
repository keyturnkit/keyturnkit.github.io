<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<style>
  :root {
    --bg: #fbfbf9; --fg: #1c1c1a; --muted: #5d5d58; --line: #e3e2dc;
    --code-bg: #f1f0ea; --accent: #1f6f4a; --accent-fg: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151614; --fg: #e9e8e2; --muted: #a3a29b; --line: #2e2f2b; --code-bg: #1e201d; --accent: #4fb386; --accent-fg: #0d1a13; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 48px 16px 80px; }
  h1 { font-size: 2.1rem; line-height: 1.2; margin: 0 0 16px; letter-spacing: -0.01em; }
  h2 { font-size: 1.35rem; margin: 56px 0 12px; }
  h3 { font-size: 1.05rem; margin: 24px 0 4px; }
  p { margin: 0 0 14px; }
  .lede { font-size: 1.15rem; color: var(--muted); }
  a { color: var(--accent); }
  .buttons { display: flex; flex-wrap: wrap; gap: 12px; margin: 24px 0 8px; }
  .btn { display: inline-block; padding: 11px 18px; border-radius: 8px; text-decoration: none; font-weight: 600; border: 1px solid var(--accent); }
  .btn.primary { background: var(--accent); color: var(--accent-fg); }
  .btn.secondary { color: var(--accent); }
  .small { font-size: 0.9rem; color: var(--muted); }
  pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; overflow-x: auto; font-size: 0.86rem; line-height: 1.5; }
  code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  p code, li code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; font-size: 0.9em; }
  ol, ul { padding-left: 1.3em; margin: 0 0 14px; }
  li { margin-bottom: 6px; }
  table { width: 100%; border-collapse: collapse; margin: 8px 0 14px; font-size: 0.95rem; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-weight: 600; }
  td.c, th.c { text-align: center; width: 90px; }
  details { border-bottom: 1px solid var(--line); padding: 12px 0; }
  summary { cursor: pointer; font-weight: 600; }
  details p { margin-top: 8px; }
  footer { margin-top: 64px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 0.9rem; color: var(--muted); }
  @media (max-width: 520px) { h1 { font-size: 1.7rem; } body { font-size: 16px; } }
</style>
</head>
<body>
<main>
  <p class="small"><a href="/">Keyturn Kit</a></p>
  {{ content }}
  <footer>
    Keyturn Kit. Free edition on <a href="https://github.com/keyturnkit/keyturn-kit">GitHub</a> (MIT). Questions: <a href="mailto:proj.seedsmesh@gmail.com">proj.seedsmesh@gmail.com</a>
  </footer>
</main>
</body>
</html>
